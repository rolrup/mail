<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 250 250" width="250" height="250">
  <defs>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="250" height="250" rx="24" fill="#0a0e14"/>
  <rect x="4" y="4" width="242" height="242" rx="20" fill="none" stroke="#4eeaec" stroke-width="2" opacity="0.4"/>
  <text x="125" y="125" text-anchor="middle" dominant-baseline="central"
        font-family="sans-serif" font-weight="bold" font-size="72"
        fill="#4eeaec" filter="url(#glow)">~mail</text>
</svg>

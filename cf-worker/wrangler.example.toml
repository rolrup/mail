name = "mail-worker"
main = "src/worker.ts"
compatibility_date = "2024-01-01"

[vars]
BRIDGE_URL = "https://bridge.example.com/v1/inbound"
WORKER_SECRET = "your-shared-secret-here"

[[email_routing.rules]]
name = "catch-all"
enabled = true
matchers = [{ type = "all" }]
actions = [{ type = "worker", value = "mail-worker" }]

[project]
name = "mail-gateway"
version = "0.1.0"
description = "Urbit Mail Gateway — bridge between Cloudflare Email Workers and Urbit ships"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "httpx",
    "pydantic-settings",
    "nh3",
    "html2text",
    "structlog",
]

[project.scripts]
mail-gateway = "mail_gateway.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mail_gateway"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "httpx",
]
